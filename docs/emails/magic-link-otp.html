<!-- Supabase Dashboard → Authentication → Emails → Magic link or OTP. Pega este HTML tal cual (usa la variable {{ .Token }} que Supabase rellena con el código de 6 dígitos). -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu código de inicio de sesión · Wheelp</title>
</head>
<body style="margin:0; padding:0; background:#faf8f2; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf8f2;">
    <tr>
      <td align="center" style="padding:40px 20px;">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background:#ffffff; border-radius:16px; overflow:hidden; border:1px solid #e6e2d8;">
          <tr>
            <td style="padding:32px 32px 0 32px; text-align:center;">
              <img src="https://wheelp.app/img/logo-email.png" width="180" alt="Wheelp" style="display:inline-block; width:180px; max-width:180px; height:auto; border:0;">
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 8px 32px;">
              <h1 style="margin:0 0 12px 0; font-size:20px; line-height:1.3; color:#101d15; font-weight:700;">Tu código de inicio de sesión</h1>
              <p style="margin:0 0 20px 0; font-size:16px; line-height:1.6; color:#57685c;">
                Usa este código en Wheelp para completar tu inicio de sesión.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 24px 32px;" align="center">
              <div style="display:inline-block; background:#eaf7ec; border-radius:12px; padding:16px 28px;">
                <span style="font-size:32px; font-weight:800; letter-spacing:0.3em; color:#163d20;">{{ .Token }}</span>
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 32px 32px;">
              <p style="margin:0; font-size:13px; line-height:1.6; color:#a3302a;">
                Si no has sido tú, no compartas este código con nadie e ignora este correo.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px; border-top:1px solid #e6e2d8; background:#faf8f2;">
              <p style="margin:0; font-size:12px; line-height:1.6; color:#57685c;">
                Este correo se envió a {{ .Email }} para iniciar sesión en tu cuenta de Wheelp.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

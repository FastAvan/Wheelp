<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheelp · Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; color: #1d1d1f; min-height: 100vh; }

    /* LOGIN */
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: white; border-radius: 18px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .logo { height: 88px; display: block; margin: 0 auto 4px; }
    .subtitle { color: #6e6e73; text-align: center; font-size: 14px; margin-bottom: 28px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 500; color: #6e6e73; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
    input { width: 100%; padding: 11px 14px; border: 1.5px solid #d2d2d7; border-radius: 10px; font-size: 15px; outline: none; transition: border-color .15s; background: #fafafa; }
    input:focus { border-color: #22c55e; background: white; }
    .divider { border: none; border-top: 1px solid #e5e5ea; margin: 18px 0; }
    .btn-primary { width: 100%; padding: 13px; background: #22c55e; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s; margin-top: 6px; }
    .btn-primary:hover { background: #16a34a; }
    .btn-primary:disabled { opacity: .55; cursor: default; }
    .error-msg { color: #ef4444; font-size: 13px; text-align: center; margin-top: 12px; }

    /* HEADER */
    #dashboard { display: none; }
    header { background: white; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e5ea; position: sticky; top: 0; z-index: 10; }
    .header-logo { height: 56px; display: block; }
    .btn-logout { background: none; border: 1.5px solid #d2d2d7; color: #6e6e73; font-size: 13px; padding: 6px 14px; border-radius: 20px; cursor: pointer; }
    .btn-logout:hover { border-color: #aeaeb2; color: #1d1d1f; }

    /* MAIN */
    main { max-width: 820px; margin: 0 auto; padding: 28px 20px 60px; }

    /* STATS */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: white; border-radius: 14px; padding: 18px 12px; text-align: center; }
    .stat-number { font-size: 30px; font-weight: 700; }
    .stat-label { font-size: 12px; color: #6e6e73; margin-top: 2px; }
    .c-gray   { color: #1d1d1f; }
    .c-orange { color: #f97316; }
    .c-green  { color: #22c55e; }
    .c-red    { color: #ef4444; }

    /* TABS */
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; align-items: center; flex-wrap: wrap; }
    .tab { padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; background: white; color: #6e6e73; transition: all .15s; }
    .tab:hover { background: #e5e5ea; }
    .tab.active { background: #22c55e; color: white; }
    .tab-spacer { flex: 1; }
    .btn-refresh { background: white; border: none; color: #6e6e73; padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .btn-refresh:hover { color: #1d1d1f; }

    /* CARDS */
    .app-card { background: white; border-radius: 14px; padding: 20px; margin-bottom: 10px; transition: opacity .2s; }
    .app-card.processing { opacity: .45; pointer-events: none; }
    .app-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .app-name { font-size: 17px; font-weight: 600; }
    .app-city { font-size: 13px; color: #6e6e73; margin-top: 3px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .badge-pending  { background: #fff7ed; color: #ea580c; }
    .badge-approved { background: #f0fdf4; color: #16a34a; }
    .badge-rejected { background: #fef2f2; color: #ef4444; }
    .app-motivation { background: #f5f5f7; border-radius: 10px; padding: 11px 14px; font-size: 14px; color: #3a3a3c; margin: 10px 0; font-style: italic; line-height: 1.5; }
    .app-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .app-date { font-size: 12px; color: #aeaeb2; }
    .app-actions { display: flex; gap: 8px; }
    .btn-approve { background: #22c55e; color: white; border: none; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-approve:hover { background: #16a34a; }
    .btn-reject  { background: none; border: 1.5px solid #ef4444; color: #ef4444; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-reject:hover { background: #fef2f2; }
    .empty { text-align: center; color: #aeaeb2; padding: 56px 0; font-size: 15px; }

    @media (max-width: 600px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      header { padding: 12px 16px; }
      main { padding: 20px 12px 40px; }
    }
  </style>
</head>

  <main>
    <div class="stats">
      <div class="stat-card"><div class="stat-number c-gray"   id="st-total">—</div><div class="stat-label">Total</div></div>
      <div class="stat-card"><div class="stat-number c-orange" id="st-pending">—</div><div class="stat-label">Pendientes</div></div>
      <div class="stat-card"><div class="stat-number c-green"  id="st-approved">—</div><div class="stat-label">Aprobadas</div></div>
      <div class="stat-card"><div class="stat-number c-red"    id="st-rejected">—</div><div class="stat-label">Rechazadas</div></div>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-all"      onclick="setFilter('all')">Todas</button>
      <button class="tab"        id="tab-pending"  onclick="setFilter('pending')">Pendientes</button>
      <button class="tab"        id="tab-approved" onclick="setFilter('approved')">Aprobadas</button>
      <button class="tab"        id="tab-rejected" onclick="setFilter('rejected')">Rechazadas</button>
      <span class="tab-spacer"></span>
      <button class="btn-refresh" onclick="loadApps()">↻ Actualizar</button>
    </div>
    <div id="app-list"></div>
  </main>
</div>

<script>
  let apps = [], filter = 'all'
  let baseUrl, anonKey, token

  // Restaurar sesión guardada en localStorage
  ;(function init() {
    baseUrl = localStorage.getItem('wb_url')
    anonKey = localStorage.getItem('wb_key')
    token   = localStorage.getItem('wb_token')
    if (baseUrl && anonKey && token) showDashboard()
    else {
      // Pre-rellenar URL y key si ya estaban guardados
      if (baseUrl) document.getElementById('inp-url').value = baseUrl
      if (anonKey) document.getElementById('inp-key').value = anonKey
    }
  })()

  async function doLogin() {
    const btn  = document.getElementById('login-btn')
    const err  = document.getElementById('login-error')
    baseUrl    = document.getElementById('inp-url').value.replace(/\/$/, '')
    anonKey    = document.getElementById('inp-key').value.trim()
    const email = document.getElementById('inp-email').value.trim()
    const pass  = document.getElementById('inp-pass').value

    if (!baseUrl || !anonKey || !email || !pass) {
      showError('Rellena todos los campos.'); return
    }
    err.style.display = 'none'
    btn.disabled = true; btn.textContent = 'Entrando…'

    try {
      const res  = await fetch(`${baseUrl}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { 'apikey': anonKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass })
      })
      const data = await res.json()
      if (!res.ok) throw new Error(data.error_description || data.msg || 'Credenciales incorrectas')
      token = data.access_token
      localStorage.setItem('wb_url',   baseUrl)
      localStorage.setItem('wb_key',   anonKey)
      localStorage.setItem('wb_token', token)
      showDashboard()
    } catch (e) {
      showError(e.message)
      btn.disabled = false; btn.textContent = 'Entrar al dashboard'
    }
  }

  function showError(msg) {
    const el = document.getElementById('login-error')
    el.textContent = msg; el.style.display = 'block'
  }

  function doLogout() {
    localStorage.removeItem('wb_token')
    location.reload()
  }

  function showDashboard() {
    document.getElementById('login-screen').style.display = 'none'
    document.getElementById('dashboard').style.display    = 'block'
    loadApps()
  }

  // ── API helpers ─────────────────────────────────────

  async function apiGet(path) {
    const r = await fetch(`${baseUrl}/rest/v1/${path}`, {
      headers: { 'apikey': anonKey, 'Authorization': `Bearer ${token}` }
    })
    if (r.status === 401) { doLogout(); return [] }
    return r.json()
  }

  async function apiRpc(fn, body) {
    const r = await fetch(`${baseUrl}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { 'apikey': anonKey, 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
    return r.ok
  }

  // ── Cargar solicitudes ───────────────────────────────

  async function loadApps() {
    document.getElementById('app-list').innerHTML = '<div class="empty">Cargando…</div>'
    try {
      apps = await apiGet('helper_applications?select=*&order=created_at.desc')
      if (!Array.isArray(apps)) throw new Error(apps.message || 'Error de conexión')
    } catch (e) {
      document.getElementById('app-list').innerHTML = `<div class="empty">Error: ${e.message}</div>`
      return
    }
    document.getElementById('st-total').textContent    = apps.length
    document.getElementById('st-pending').textContent  = apps.filter(a => a.status === 'pending').length
    document.getElementById('st-approved').textContent = apps.filter(a => a.status === 'approved').length
    document.getElementById('st-rejected').textContent = apps.filter(a => a.status === 'rejected').length
    renderApps()
  }

  function setFilter(f) {
    filter = f
    ;['all','pending','approved','rejected'].forEach(x => {
      document.getElementById(`tab-${x}`).className = 'tab' + (x === f ? ' active' : '')
    })
    renderApps()
  }

  function renderApps() {
    const list = apps.filter(a => filter === 'all' || a.status === filter)
    const el   = document.getElementById('app-list')
    if (!list.length) {
      el.innerHTML = '<div class="empty">No hay solicitudes en esta categoría.</div>'; return
    }
    el.innerHTML = list.map(a => {
      const bClass = { pending: 'badge-pending', approved: 'badge-approved', rejected: 'badge-rejected' }[a.status] || 'badge-pending'
      const bLabel = { pending: 'Pendiente', approved: 'Aprobado', rejected: 'Rechazado' }[a.status] || a.status
      const date   = new Date(a.created_at).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })
      const motiv  = a.motivation ? `<div class="app-motivation">"${escHtml(a.motivation)}"</div>` : ''
      const btns   = a.status === 'pending' ? `
        <div class="app-actions">
          <button class="btn-reject"  onclick="rejectApp('${a.id}')">Rechazar</button>
          <button class="btn-approve" onclick="approveApp('${a.id}')">Aprobar ✓</button>
        </div>` : ''
      return `
        <div class="app-card" id="c-${a.id}">
          <div class="app-header">
            <div>
              <div class="app-name">${escHtml(a.display_name)}</div>
              <div class="app-city">📍 ${escHtml(a.city)}</div>
            </div>
            <span class="badge ${bClass}">${bLabel}</span>
          </div>
          ${motiv}
          <div class="app-footer">
            <span class="app-date">${date}</span>
            ${btns}
          </div>
        </div>`
    }).join('')
  }

  // ── Acciones ─────────────────────────────────────────

  async function approveApp(id) {
    document.getElementById(`c-${id}`).classList.add('processing')
    const ok = await apiRpc('approve_helper_application', { application_id: id })
    if (!ok) { alert('No se pudo aprobar. Comprueba que el SQL de la 10ª parte esté ejecutado en Supabase.'); await loadApps(); return }
    await loadApps()
  }

  async function rejectApp(id) {
    if (!confirm('¿Rechazar esta solicitud?')) return
    document.getElementById(`c-${id}`).classList.add('processing')
    const ok = await apiRpc('reject_helper_application', { application_id: id })
    if (!ok) { alert('No se pudo rechazar.'); await loadApps(); return }
    await loadApps()
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }
</script>

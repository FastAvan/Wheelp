name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    # macos-15 trae como mucho Xcode 16.4 (Swift 6.1.2) y DiditSDK.framework
    # está compilado con Swift 6.3.3: el módulo no carga en un toolchain más
    # antiguo. macos-26 trae Xcode 26.x, con Swift >= 6.3.3.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -workspace Wheelp.xcworkspace \
            -scheme Wheelp \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0

      - name: Run XCTest suite (WheelpTests)
        run: |
          xcodebuild test \
            -workspace Wheelp.xcworkspace \
            -scheme Wheelp \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate crypto protocol (standalone)
        run: swift scripts/validate.swift

  # Las puertas de autorización no se pueden probar desde XCTest sin red: viven
  # en Postgres. Job aparte y en Ubuntu porque ahí psql ya viene instalado.
  # Se salta solo si no hay secreto configurado, para que un fork no falle.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probar RLS y puertas de auth
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Sin SUPABASE_DB_URL: las pruebas de autorización NO se han ejecutado"
            exit 0
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls.sql

  # Entrega continua: cada push a main que pase el build Y las pruebas de
  # autorización sale a TestFlight. El `needs` no es decoración — hoy hemos
  # visto que algo puede estar roto en producción y parecer que funciona, así
  # que una build no se distribuye sin las dos puertas en verde.
  #
  # No hacen falta certificados ni perfiles como secretos: la clave de API tiene
  # rol Admin, así que -allowProvisioningUpdates usa los certificados de
  # distribución que gestiona Apple. Un secreto menos que rotar, y menos
  # material criptográfico rondando un repositorio público.
  #
  # El precio de eso es que cada ejecución se deja un certificado de desarrollo
  # tirado en la cuenta, y el cupo es compartido por todas las apps: el 3 de
  # septiembre se llenó y dejaron de archivar Wheelp y Clickwheel a la vez. Por
  # eso se limpian los anteriores antes de archivar.
  testflight:
    needs: [build-and-validate, rls]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # el número de build sale del recuento de commits

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Colocar la clave de App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      # Sin esto el cupo de certificados de la cuenta se llena en unas ocho runs
      # y dejan de archivar todas las apps. El detalle está en el script.
      - name: Revocar certificados desechables de runs anteriores
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography
          python3 ci/revoke_stale_certs.py

      - name: Calcular número de build
        id: version
        run: |
          # El recuento de commits es monótono, que es lo único que exige App
          # Store Connect. El desfase de 100 existe porque las subidas manuales
          # de agosto llegaron a la 126 y un número repetido o menor se rechaza.
          echo "build=$(( 100 + $(git rev-list --count HEAD) ))" >> "$GITHUB_OUTPUT"

      - name: Archivar
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace Wheelp.xcworkspace \
            -scheme Wheelp \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Wheelp.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Subir a TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Wheelp.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Borrar la clave
        if: always()
        run: rm -rf ~/private_keys

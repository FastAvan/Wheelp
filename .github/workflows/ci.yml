name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    # macos-15 trae como mucho Xcode 16.4 (Swift 6.1.2) y DiditSDK.framework
    # está compilado con Swift 6.3.3: el módulo no carga en un toolchain más
    # antiguo. macos-26 trae Xcode 26.x, con Swift >= 6.3.3.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -workspace Wheelp.xcworkspace \
            -scheme Wheelp \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0

      - name: Run XCTest suite (WheelpTests)
        run: |
          xcodebuild test \
            -workspace Wheelp.xcworkspace \
            -scheme Wheelp \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate crypto protocol (standalone)
        run: swift scripts/validate.swift

  # Las puertas de autorización no se pueden probar desde XCTest sin red: viven
  # en Postgres. Job aparte y en Ubuntu porque ahí psql ya viene instalado.
  # Se salta solo si no hay secreto configurado, para que un fork no falle.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probar RLS y puertas de auth
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Sin SUPABASE_DB_URL: las pruebas de autorización NO se han ejecutado"
            exit 0
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls.sql

  # Entrega continua: cada push a main que pase el build Y las pruebas de
  # autorización sale a TestFlight. El `needs` no es decoración — hoy hemos
  # visto que algo puede estar roto en producción y parecer que funciona, así
  # que una build no se distribuye sin las dos puertas en verde.
  #
  # La firma usa una identidad fija guardada en secrets. Antes se apoyaba en
  # -allowProvisioningUpdates para no tener material criptográfico en un repo
  # público, pero en un runner efímero eso encuentra el llavero vacío y pide a
  # Apple un certificado de desarrollo nuevo en CADA ejecución. El cupo es de la
  # cuenta entera, así que el 3 de septiembre se agotó y dejaron de archivar
  # tanto Wheelp como Clickwheel.
  #
  # El .p12 va cifrado como secret: GitHub no los expone a workflows de PRs
  # desde forks, y este job solo corre en push a main.
  testflight:
    needs: [build-and-validate, rls]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # el número de build sale del recuento de commits

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Importar identidad de firma
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          DIST_PROFILE: ${{ secrets.DIST_PROFILE }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm -f "$RUNNER_TEMP/dist.p12"

          # Xcode 16 movió la carpeta de perfiles; se instala en las dos por si acaso.
          for dir in ~/Library/MobileDevice/Provisioning\ Profiles \
                     ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
            mkdir -p "$dir"
            printf '%s' "$DIST_PROFILE" | base64 --decode > "$dir/wheelp.mobileprovision"
          done

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Colocar la clave de App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Calcular número de build
        id: version
        run: |
          # El recuento de commits es monótono, que es lo único que exige App
          # Store Connect. El desfase de 100 existe porque las subidas manuales
          # de agosto llegaron a la 126 y un número repetido o menor se rechaza.
          echo "build=$(( 100 + $(git rev-list --count HEAD) ))" >> "$GITHUB_OUTPUT"

      - name: Archivar
        run: |
          xcodebuild archive \
            -workspace Wheelp.xcworkspace \
            -scheme Wheelp \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Wheelp.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Wheelp App Store CI" \
            DEVELOPMENT_TEAM=967AMV9QSH \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain-db"

      - name: Subir a TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Wheelp.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Borrar la clave
        if: always()
        run: |
          rm -rf ~/private_keys
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    # macos-15 trae como mucho Xcode 16.4 (Swift 6.1.2) y DiditSDK.framework
    # está compilado con Swift 6.3.3: el módulo no carga en un toolchain más
    # antiguo. macos-26 trae Xcode 26.x, con Swift >= 6.3.3.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -workspace Wheelp.xcworkspace \
            -scheme Wheelp \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0

      - name: Run XCTest suite (WheelpTests)
        run: |
          xcodebuild test \
            -workspace Wheelp.xcworkspace \
            -scheme Wheelp \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate crypto protocol (standalone)
        run: swift scripts/validate.swift

  # Las puertas de autorización no se pueden probar desde XCTest sin red: viven
  # en Postgres. Job aparte y en Ubuntu porque ahí psql ya viene instalado.
  # Se salta solo si no hay secreto configurado, para que un fork no falle.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probar RLS y puertas de auth
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Sin SUPABASE_DB_URL: las pruebas de autorización NO se han ejecutado"
            exit 0
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls.sql

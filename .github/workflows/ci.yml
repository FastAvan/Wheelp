name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -workspace Wheelp.xcworkspace \
            -scheme Wheelp \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            | grep -E "^(Build|error:|warning:|CompileSwift|Ld )" || true

      - name: Run XCTest suite (WheelpTests)
        run: |
          xcodebuild test \
            -workspace Wheelp.xcworkspace \
            -scheme Wheelp \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate crypto protocol (standalone)
        run: swift scripts/validate.swift
